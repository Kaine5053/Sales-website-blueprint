<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — Northwind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="icon" href="/assets/img/icon.svg">
  <style>
    .nf {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: var(--gutter);
      background: var(--gradient-subtle);
    }
    .nf__inner { max-width: 36rem; }
    .nf__code {
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: var(--fw-extrabold);
      line-height: 1;
      letter-spacing: var(--tracking-tight);
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nf h1 { font-size: var(--fs-2xl); margin-block: var(--sp-3) var(--sp-3); }
    .nf p { color: var(--text-muted); margin-bottom: var(--sp-7); font-size: var(--fs-md); }
    .nf__actions { display: flex; gap: var(--sp-3); justify-content: center; flex-wrap: wrap; }
    .nf__brand {
      display: inline-flex; align-items: center; gap: var(--sp-3);
      font-weight: var(--fw-extrabold); font-size: var(--fs-lg);
      margin-bottom: var(--sp-7);
    }
    .nf__brand .brand__mark { width: 36px; height: 36px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__inner">
      <a href="/" class="nf__brand">
        <span class="brand__mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l6-9 6 9-6 9z" opacity=".9"/><path d="M15 3l6 9-6 9"/></svg></span>
        <span>Northwind</span>
      </a>
      <div class="nf__code">404</div>
      <h1>This page took a wrong turn</h1>
      <p>We couldn’t find what you were looking for — but our team can help you find the right product.</p>
      <div class="nf__actions">
        <a class="btn btn--primary btn--lg" href="/">Back to home</a>
        <a class="btn btn--secondary btn--lg" href="/#products">Browse products</a>
        <a class="btn btn--ghost btn--lg" href="/#quiz">Help me choose</a>
      </div>
    </div>
  </main>
</body>
</html>
